<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#12111a">
  <title>GOG Downloader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" hidden>
    <header class="appbar">
      <button class="icon-button" id="back-button" hidden aria-label="Back">&#8592;</button>
      <h1 id="screen-title">Library</h1>
      <div class="appbar-actions">
        <button class="icon-button" id="search-toggle" aria-label="Search library">&#9906;</button>
      </div>
      <form class="searchbar" id="searchbar" hidden role="search">
        <input type="search" id="search-input" placeholder="Search your library" autocomplete="off" aria-label="Search your library">
        <button type="button" class="icon-button" id="search-close" aria-label="Close search">&#10005;</button>
      </form>
    </header>

    <main id="main" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button data-route="library" class="tab" aria-current="page"><span class="tab-icon">&#9636;</span>Library</button>
      <button data-route="queue" class="tab"><span class="tab-icon">&#8595;</span>Queue<span class="badge" id="queue-badge" hidden>0</span></button>
      <button data-route="settings" class="tab"><span class="tab-icon">&#9881;</span>Settings</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
